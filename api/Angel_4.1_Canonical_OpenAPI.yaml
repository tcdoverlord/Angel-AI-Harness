        selected:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        duplicates_removed:
          type: integer
          minimum: 0
    RagRunInspector:
      type: object
      required:
      - summary
      - retrieval
      - candidates
      - context
      - answer
      - evaluation
      - evidence
      - measurements
      - snapshots
      properties:
        summary:
          $ref: '#/components/schemas/RagRunSummary'
        retrieval:
          $ref: '#/components/schemas/RetrievalInspection'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        context:
          $ref: '#/components/schemas/ContextBuild'
        answer:
          $ref: '#/components/schemas/GeneratedAnswer'
        evaluation:
          oneOf:
          - $ref: '#/components/schemas/Evaluation'
          - type: 'null'
        evidence:
          oneOf:
          - $ref: '#/components/schemas/EvidenceGraph'
          - type: 'null'
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/HealthSnapshot'
