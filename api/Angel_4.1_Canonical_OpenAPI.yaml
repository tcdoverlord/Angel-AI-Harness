openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Angel 4.1 Canonical API
  version: 4.1.0
  description: 'Canonical Angel 4.1 OpenAPI contract.


    Domains:

    1. Project Workspace

    2. Knowledge

    3. Files

    4. Retrieval Scope

    5. RAG Runtime

    6. RAG Inspector

    7. Evaluation

    8. Evidence

    9. Measurements

    10. Snapshots

    11. Recommendations

    12. Knowledge Changes

    13. Index Builds

    14. Operations

    15. Problem Details


    Canonical lifecycle:

    Project → Retrieval Policy → Resolved Retrieval Scope → RAG Run → Evaluation

    → Evidence → Measurement → Snapshot → Recommendation → User Decision

    → Knowledge Change → Index Build → New RAG Run.


    RAG is Angel''s evidence-producing runtime. Knowledge Engineering observes,

    evaluates, explains, measures, snapshots, recommends, and records changes

    around that runtime.


    Rule 4.1.9 — Error Transparency:

    Failures use structured Problem Details, are observable, and do not mutate

    engineering records.


    Rule 4.1.10 — Endpoint Error Examples:

    Every declared non-2xx response defines a Problem Details schema, response

    definition, and concrete endpoint-level example.


    Integrity rules:

    - RAG Runs preserve the exact execution configuration and resolved Project context.

    - Selected and rejected retrieval candidates remain inspectable.

    - Candidates and context items preserve immutable lineage.

    - Unknown measurements remain unknown and are never represented as zero.

    - Recommendations are evidence-backed and advisory.

    - User knowledge is never silently modified.

    - Generated answers never automatically become trusted knowledge.

    - Health summaries never replace supporting evidence.

    - Historical comparisons identify evaluation and index versions.

    '
servers:
- url: /api/v1
  description: Local Angel API
tags:
- name: Core Runtime
  description: Runtime RAG execution and answer generation.
- name: Projects
  description: Project workspaces and project context.
- name: Project Conversations
- name: Project Knowledge
- name: Project Files
- name: Project Settings
- name: Project Retrieval
- name: RAG Runs
- name: Evaluations
- name: Evidence
- name: Measurements
- name: Snapshots
- name: Recommendations
- name: Knowledge Changes
- name: Indexes
- name: Operations
paths:
  /rag-runs:
    post:
      tags:
      - RAG Runs
      operationId: createRagRun
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagRunCreateRequest'
      responses:
        '202':
          description: RAG run accepted
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagRunAccepted'
        '400':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/invalid_request
                title: Bad Request
                status: 400
                code: INVALID_REQUEST
                detail: The request could not be processed.
                operation_id: createRagRun
                path: /rag-runs
        '409':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/resource_conflict
                title: Conflict
                status: 409
                code: RESOURCE_CONFLICT
                detail: The resource changed or is otherwise incompatible with this operation.
                operation_id: createRagRun
                path: /rag-runs
        '422':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/request_not_processable
                title: Unprocessable Entity
                status: 422
                code: REQUEST_NOT_PROCESSABLE
                detail: The supplied values cannot be processed in the current state.
                operation_id: createRagRun
                path: /rag-runs
  /rag-runs/{rag_run_id}:
    get:
      tags:
      - RAG Runs
      operationId: getRagRun
      parameters:
      - $ref: '#/components/parameters/RagRunId'
      responses:
        '200':
          description: Immutable RAG run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagRun'
        '404':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/resource_not_found
                title: Not Found
                status: 404
                code: RESOURCE_NOT_FOUND
                detail: The requested resource does not exist or is not accessible.
                operation_id: getRagRun
                path: /rag-runs/{rag_run_id}
  /rag-runs/{rag_run_id}/candidates:
    get:
      tags:
      - RAG Runs
      - Evidence
      operationId: listRagCandidates
      parameters:
      - $ref: '#/components/parameters/RagRunId'
      - name: selected
        in: query
        schema:
          type: boolean
      - name: rejection_reason
        in: query
        schema:
          $ref: '#/components/schemas/CandidateRejectionReason'
      - name: pack_id
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Selected and rejected retrieval candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalCandidatePage'
  /rag-runs/{rag_run_id}/context:
    get:
      tags:
      - RAG Runs
      - Evidence
      operationId: getRagContext
      parameters:
      - $ref: '#/components/parameters/RagRunId'
      responses:
        '200':
          description: Final model context and budget diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextBuild'
  /rag-runs/{rag_run_id}/answer:
    get:
      tags:
      - RAG Runs
      operationId: getRagAnswer
      parameters:
      - $ref: '#/components/parameters/RagRunId'
      responses:
        '200':
          description: Generated answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedAnswer'
  /evaluation-runs:
    post:
      tags:
      - Evaluations
      operationId: createEvaluationRun
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRunCreateRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /evaluations:
    post:
      tags:
      - Evaluations
      operationId: evaluateExistingRagRun
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExistingRagEvaluationRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /evaluations/{evaluation_id}:
    get:
      tags:
      - Evaluations
      operationId: getEvaluation
      parameters:
      - $ref: '#/components/parameters/EvaluationId'
      responses:
        '200':
          description: Evaluation assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
  /evaluations/{evaluation_id}/evidence:
    get:
      tags:
      - Evaluations
      - Evidence
      operationId: getEvaluationEvidence
      parameters:
      - $ref: '#/components/parameters/EvaluationId'
      responses:
        '200':
          description: Document-to-claim evidence graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceGraph'
  /measurement-runs:
    post:
      tags:
      - Measurements
      operationId: createMeasurementRun
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementRunRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /measurements/{measurement_id}:
    get:
      tags:
      - Measurements
      operationId: getMeasurement
      parameters:
      - $ref: '#/components/parameters/MeasurementId'
      responses:
        '200':
          description: Evidence-derived measurement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
  /measurements/{measurement_id}/evidence:
    get:
      tags:
      - Measurements
      - Evidence
      operationId: getMeasurementEvidence
      parameters:
      - $ref: '#/components/parameters/MeasurementId'
      responses:
        '200':
          description: Measurement evidence graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceGraph'
  /health-snapshots:
    post:
      tags:
      - Snapshots
      operationId: createHealthSnapshot
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthSnapshotCreateRequest'
      responses:
        '201':
          description: Health snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSnapshot'
  /health-snapshots/{snapshot_id}:
    get:
      tags:
      - Snapshots
      operationId: getHealthSnapshot
      parameters:
      - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Immutable health snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSnapshot'
  /health-snapshots/{snapshot_id}/comparison:
    get:
      tags:
      - Snapshots
      operationId: compareHealthSnapshots
      parameters:
      - $ref: '#/components/parameters/SnapshotId'
      - name: against
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Snapshot comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotComparison'
  /recommendation-runs:
    post:
      tags:
      - Recommendations
      operationId: createRecommendationRun
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRunRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /recommendations/{recommendation_id}:
    get:
      tags:
      - Recommendations
      operationId: getRecommendation
      parameters:
      - $ref: '#/components/parameters/RecommendationId'
      responses:
        '200':
          description: Evidence-backed recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
  /recommendations/{recommendation_id}/evidence:
    get:
      tags:
      - Recommendations
      - Evidence
      operationId: getRecommendationEvidence
      parameters:
      - $ref: '#/components/parameters/RecommendationId'
      responses:
        '200':
          description: Recommendation evidence graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceGraph'
  /recommendations/{recommendation_id}/decisions:
    post:
      tags:
      - Recommendations
      operationId: recordRecommendationDecision
      parameters:
      - $ref: '#/components/parameters/RecommendationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationDecisionRequest'
      responses:
        '200':
          description: Recommendation updated without modifying knowledge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
  /recommendations/{recommendation_id}/retest:
    post:
      tags:
      - Recommendations
      - Evaluations
      operationId: retestRecommendation
      parameters:
      - $ref: '#/components/parameters/RecommendationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetestRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /knowledge-change-sets:
    post:
      tags:
      - Knowledge Changes
      operationId: createKnowledgeChangeSet
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeChangeSetCreateRequest'
      responses:
        '201':
          description: Draft knowledge change set created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeChangeSet'
  /knowledge-change-sets/{change_set_id}:
    get:
      tags:
      - Knowledge Changes
      operationId: getKnowledgeChangeSet
      parameters:
      - $ref: '#/components/parameters/ChangeSetId'
      responses:
        '200':
          description: Knowledge change set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeChangeSet'
