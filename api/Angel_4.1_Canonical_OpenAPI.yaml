      operationId: listProjectDocuments
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Documents explicitly attached to the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDocumentPage'
    post:
      tags:
      - Project Knowledge
      operationId: attachDocumentToProject
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
