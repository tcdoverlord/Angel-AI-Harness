              schema:
                $ref: '#/components/schemas/ProjectFilePage'
    post:
      tags:
      - Project Files
      operationId: registerProjectFile
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectFileCreateRequest'
      responses:
        '201':
          description: Project file registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFile'
  /projects/{project_id}/files/{file_id}:
    get:
      tags:
      - Project Files
      operationId: getProjectFile
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Project file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFile'
    patch:
      tags:
      - Project Files
      operationId: updateProjectFile
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectFileUpdateRequest'
      responses:
        '200':
          description: Updated project file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFile'
    delete:
      tags:
      - Project Files
      operationId: removeProjectFile
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: File removed from project
  /projects/{project_id}/settings:
    get:
      tags:
      - Project Settings
      operationId: getProjectSettings
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSettings'
    patch:
      tags:
      - Project Settings
      operationId: updateProjectSettings
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectSettingsUpdateRequest'
      responses:
        '200':
          description: Updated project settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSettings'
  /projects/{project_id}/retrieval-scope/preview:
    post:
      tags:
      - Project Retrieval
      operationId: previewProjectRetrievalScope
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRetrievalScopeOverride'
      responses:
        '200':
          description: Resolved project retrieval scope preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedProjectRetrievalScope'
  /rag-runs/{rag_run_id}/inspector:
    get:
      tags:
      - RAG Runs
      - Evidence
      operationId: getRagRunInspector
      parameters:
      - $ref: '#/components/parameters/RagRunId'
      responses:
        '200':
          description: Read-only consolidated RAG run inspection view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagRunInspector'
        '404':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/resource_not_found
                title: Not Found
                status: 404
                code: RESOURCE_NOT_FOUND
                detail: The requested resource does not exist or is not accessible.
                operation_id: getRagRunInspector
                path: /rag-runs/{rag_run_id}/inspector
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 255
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    RagRunId:
      name: rag_run_id
      in: path
      required: true
      schema:
        type: string
    EvaluationId:
      name: evaluation_id
      in: path
      required: true
      schema:
        type: string
    MeasurementId:
      name: measurement_id
      in: path
      required: true
      schema:
        type: string
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
    RecommendationId:
      name: recommendation_id
      in: path
      required: true
      schema:
        type: string
    ChangeSetId:
      name: change_set_id
      in: path
      required: true
      schema:
        type: string
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
    ProjectStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ProjectStatus'
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PackId:
      name: pack_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ProblemResponse:
      description: Request could not be completed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    OperationAccepted:
      description: Asynchronous operation accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]*$
    Timestamp:
      type: string
      format: date-time
    Hash:
      type: string
      pattern: ^sha256:[a-fA-F0-9]{64}$
    ResourceLinks:
      type: object
      additionalProperties:
        type: string
        format: uri-reference
    MeasurementState:
      type: string
      enum:
      - measured
      - not_evaluated
      - insufficient_evidence
      - not_applicable
      - failed
    TriState:
      type: string
      enum:
      - 'yes'
      - 'no'
      - unknown
      - not_applicable
    FailureClassification:
      type:
      - string
      - 'null'
      enum:
      - out_of_scope
      - knowledge_gap
      - retrieval_failure
      - ranking_failure
      - context_selection_failure
      - context_budget_failure
      - reasoning_failure
      - grounding_failure
      - successful
      - indeterminate
      - null
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        recoverable:
          type: boolean
        trace_id:
          type: string
      additionalProperties: true
    PageMetadata:
      type: object
      required:
      - limit
      - has_more
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 500
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
    Operation:
      type: object
      required:
      - operation_id
      - operation_type
      - status
      - created_at
      properties:
        operation_id:
          $ref: '#/components/schemas/Identifier'
        operation_type:
          type: string
          enum:
          - rag_run
          - evaluation_run
          - measurement_run
          - snapshot_creation
          - recommendation_run
          - index_build
          - recommendation_retest
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - partially_completed
          - failed
          - canceled
        progress:
          type:
          - object
          - 'null'
          properties:
            completed:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
            percentage:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 100
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
        error:
          oneOf:
          - $ref: '#/components/schemas/ProblemDetails'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        links:
          $ref: '#/components/schemas/ResourceLinks'
    RetrievalScope:
      type: object
      properties:
        pack_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        document_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        project_id:
          type:
          - string
          - 'null'
        include_memory:
          type: boolean
          default: true
        include_conversation:
          type: boolean
          default: true
        include_disabled_packs:
          type: boolean
          default: false
    ContextConstraints:
      type: object
      required:
      - maximum_context_tokens
      - reserved_output_tokens
      properties:
        maximum_context_tokens:
          type: integer
          minimum: 256
        maximum_knowledge_tokens:
          type: integer
          minimum: 0
        maximum_memory_tokens:
          type: integer
          minimum: 0
        maximum_conversation_tokens:
          type: integer
          minimum: 0
        reserved_output_tokens:
          type: integer
          minimum: 0
        maximum_chunks:
          type: integer
          minimum: 1
        per_pack_chunk_limit:
          type:
          - integer
          - 'null'
          minimum: 1
    RagRunCreateRequest:
      type: object
      required:
      - question
      - mode
      - retrieval_profile_id
      - constraints
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 20000
        mode:
          type: string
          enum:
          - retrieval_only
          - context_only
          - answer
          - evaluation
        conversation_id:
          type:
          - string
          - 'null'
        user_message_id:
          type:
          - string
          - 'null'
        evaluation_run_id:
          type:
          - string
          - 'null'
        retrieval_profile_id:
          $ref: '#/components/schemas/Identifier'
        scope:
          $ref: '#/components/schemas/RetrievalScope'
        constraints:
          $ref: '#/components/schemas/ContextConstraints'
        diagnostics:
          type: object
          properties:
            retain_rejected_candidates:
              type: boolean
              default: true
            retain_rendered_context:
              type: boolean
              default: true
            retain_query_variants:
              type: boolean
              default: true
            retain_events:
              type: boolean
              default: true
        project_id:
          type:
          - string
          - 'null'
        project_scope_override:
          oneOf:
          - $ref: '#/components/schemas/ProjectRetrievalScopeOverride'
          - type: 'null'
    RagRunAccepted:
      type: object
      required:
      - rag_run_id
      - operation_id
      - status
      - links
      properties:
        rag_run_id:
          $ref: '#/components/schemas/Identifier'
        operation_id:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum:
          - queued
          - running
        links:
          $ref: '#/components/schemas/ResourceLinks'
    ContextSummary:
      type: object
      required:
      - total_input_tokens
      - model_context_limit
      - reserved_output_tokens
      - within_budget
      properties:
        system_tokens:
          type: integer
          minimum: 0
        conversation_tokens:
          type: integer
          minimum: 0
        memory_tokens:
          type: integer
          minimum: 0
        knowledge_tokens:
          type: integer
          minimum: 0
        project_tokens:
          type: integer
          minimum: 0
        question_tokens:
          type: integer
          minimum: 0
        total_input_tokens:
          type: integer
          minimum: 0
        model_context_limit:
          type: integer
          minimum: 1
        reserved_output_tokens:
          type: integer
          minimum: 0
        within_budget:
          type: boolean
        truncation_applied:
          type: boolean
    RagRun:
      type: object
      required:
      - rag_run_id
      - status
      - question
      - configuration
      - retrieval
      - context
      - started_at
      properties:
        rag_run_id:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - partial
          - failed
          - canceled
        question:
          type: object
          required:
          - original
          properties:
            original:
              type: string
            normalized:
              type:
              - string
              - 'null'
            intent:
              type:
              - string
              - 'null'
            retrieval_required:
              type: boolean
        configuration:
          type: object
          required:
          - retrieval_profile_id
          - index_version_id
          - retrieval_mode
          - configuration_fingerprint
          properties:
            retrieval_profile_id:
              $ref: '#/components/schemas/Identifier'
            index_version_id:
              $ref: '#/components/schemas/Identifier'
            retrieval_mode:
              type: string
              enum:
              - lexical
              - semantic
              - hybrid
            configuration_fingerprint:
              $ref: '#/components/schemas/Hash'
        retrieval:
          type: object
          required:
          - eligible_sources
          - queries
          - candidates
          - selected
          - rejected
          properties:
            eligible_sources:
              type: integer
              minimum: 0
            sources_searched:
              type: integer
              minimum: 0
            queries:
              type: integer
              minimum: 0
            candidates:
              type: integer
              minimum: 0
            selected:
              type: integer
              minimum: 0
            rejected:
              type: integer
              minimum: 0
            duplicates_removed:
              type: integer
              minimum: 0
        context:
          $ref: '#/components/schemas/ContextSummary'
        answer:
          oneOf:
          - $ref: '#/components/schemas/AnswerReference'
          - type: 'null'
        failure_stage:
          type:
          - string
          - 'null'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        duration_ms:
          type:
          - integer
          - 'null'
          minimum: 0
        links:
          $ref: '#/components/schemas/ResourceLinks'
        project_context:
          oneOf:
          - $ref: '#/components/schemas/RagRunProjectContext'
          - type: 'null'
    AnswerReference:
      type: object
      required:
      - answer_id
      - status
      properties:
        answer_id:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum:
          - pending
          - generating
          - completed
          - failed
    CandidateRejectionReason:
      type:
      - string
      - 'null'
      enum:
      - below_threshold
      - duplicate
      - pack_limit
      - document_limit
      - token_budget
      - reranked_out
      - disabled_source
      - stale_index
      - manual_exclusion
      - null
    SourceReference:
      type: object
      required:
      - pack_id
      - document_id
      - document_revision_id
      - chunk_id
      properties:
        pack_id:
          $ref: '#/components/schemas/Identifier'
        pack_name:
          type: string
        document_id:
          $ref: '#/components/schemas/Identifier'
        document_revision_id:
          $ref: '#/components/schemas/Identifier'
        document_name:
          type: string
        section_id:
          type:
          - string
          - 'null'
        section_heading:
          type:
          - string
          - 'null'
        chunk_id:
          $ref: '#/components/schemas/Identifier'
        content_hash:
          $ref: '#/components/schemas/Hash'
    AlgorithmScore:
      type: object
      required:
      - algorithm
      properties:
        algorithm:
          type: string
        algorithm_version:
          type:
          - string
          - 'null'
        raw:
          type:
          - number
          - 'null'
        normalized:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
    CandidateScores:
      type: object
      properties:
        bm25:
          oneOf:
          - $ref: '#/components/schemas/AlgorithmScore'
          - type: 'null'
        keyword_overlap:
          oneOf:
          - $ref: '#/components/schemas/AlgorithmScore'
          - type: 'null'
        semantic_similarity:
          oneOf:
          - $ref: '#/components/schemas/AlgorithmScore'
          - type: 'null'
        reranker:
          oneOf:
          - $ref: '#/components/schemas/AlgorithmScore'
          - type: 'null'
        final:
          oneOf:
          - $ref: '#/components/schemas/AlgorithmScore'
          - type: 'null'
    CandidateRanks:
      type: object
      properties:
        lexical:
          type:
          - integer
          - 'null'
          minimum: 1
        semantic:
          type:
          - integer
          - 'null'
          minimum: 1
        merged:
          type:
          - integer
          - 'null'
          minimum: 1
        reranked:
          type:
          - integer
          - 'null'
          minimum: 1
        final:
          type:
          - integer
          - 'null'
          minimum: 1
    RetrievalCandidate:
      type: object
      required:
      - candidate_id
      - source
      - scores
      - ranks
      - selected
      - token_count
      properties:
        candidate_id:
          $ref: '#/components/schemas/Identifier'
        source:
          $ref: '#/components/schemas/SourceReference'
        scores:
          $ref: '#/components/schemas/CandidateScores'
        ranks:
          $ref: '#/components/schemas/CandidateRanks'
        selected:
          type: boolean
        rejection_reason:
          $ref: '#/components/schemas/CandidateRejectionReason'
        token_count:
          type: integer
          minimum: 0
        inclusion_reason:
          type:
          - string
          - 'null'
    RetrievalCandidatePage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        page:
          $ref: '#/components/schemas/PageMetadata'
    ContextItem:
      type: object
      required:
      - context_item_id
      - type
      - position
      - token_count
      properties:
        context_item_id:
          $ref: '#/components/schemas/Identifier'
        type:
          type: string
          enum:
          - system
          - conversation
          - memory
          - knowledge
          - project
          - question
        source_id:
          type:
          - string
          - 'null'
        candidate_id:
          type:
          - string
          - 'null'
        position:
          type: integer
          minimum: 0
        source_marker:
          type:
          - string
          - 'null'
        token_count:
          type: integer
          minimum: 0
        rendered_text_hash:
          type:
          - string
          - 'null'
        inclusion_reason:
          type:
          - string
          - 'null'
    ContextBuild:
      type: object
      required:
      - context_build_id
      - rag_run_id
      - budget
      - validation
      - items
      - builder_version
      - context_hash
      properties:
        context_build_id:
          $ref: '#/components/schemas/Identifier'
        rag_run_id:
          $ref: '#/components/schemas/Identifier'
        budget:
          $ref: '#/components/schemas/ContextSummary'
        validation:
          type: object
          required:
          - within_budget
          - truncation_applied
          properties:
            within_budget:
              type: boolean
            truncation_applied:
              type: boolean
            truncation_reason:
              type:
              - string
              - 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContextItem'
        builder_version:
          type: string
        context_hash:
          $ref: '#/components/schemas/Hash'
    HealthReference:
      type: object
      required:
      - score
      - status
      properties:
        score:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        status:
          $ref: '#/components/schemas/MeasurementState'
    GeneratedAnswer:
      type: object
      required:
      - answer_id
      - rag_run_id
      - status
      - model
      - answer_health
      properties:
        answer_id:
          $ref: '#/components/schemas/Identifier'
        rag_run_id:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum:
          - pending
          - generating
          - completed
          - failed
        text:
          type:
          - string
          - 'null'
        model:
          type: object
          required:
          - provider
          - name
          properties:
            provider:
              type: string
            name:
              type: string
            configuration_fingerprint:
              type:
              - string
              - 'null'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceReference'
        answer_health:
          $ref: '#/components/schemas/HealthReference'
    EvaluationRunCreateRequest:
      type: object
      required:
      - evaluation_set_id
      - run_mode
      - retrieval_profile_id
      - index_version_id
      properties:
        evaluation_set_id:
          $ref: '#/components/schemas/Identifier'
        run_mode:
          type: string
          enum:
          - knowledge_only
          - retrieval_only
          - full_answer
        retrieval_profile_id:
          $ref: '#/components/schemas/Identifier'
        index_version_id:
          $ref: '#/components/schemas/Identifier'
        model_configuration:
          type:
          - object
          - 'null'
          additionalProperties: true
    ExistingRagEvaluationRequest:
      type: object
      required:
      - rag_run_id
      - evaluators
      properties:
        rag_run_id:
          $ref: '#/components/schemas/Identifier'
        evaluation_case_id:
          type:
          - string
          - 'null'
        evaluators:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - knowledge_presence
            - retrieval
            - context_selection
            - answer_usage
            - answer_grounding
    Evaluation:
      type: object
      required:
      - evaluation_id
      - rag_run_id
      - diagnosis
      - created_at
      properties:
        evaluation_id:
          $ref: '#/components/schemas/Identifier'
        evaluation_run_id:
          type:
          - string
          - 'null'
        evaluation_case_id:
          type:
          - string
          - 'null'
        rag_run_id:
          $ref: '#/components/schemas/Identifier'
        diagnosis:
          type: object
          required:
          - in_scope
          - knowledge_present
          - expected_evidence_retrieved
          - evidence_in_context
          - evidence_used
          - claims_grounded
          - classification
          properties:
            in_scope:
              $ref: '#/components/schemas/TriState'
            knowledge_present:
              $ref: '#/components/schemas/TriState'
            expected_evidence_retrieved:
              $ref: '#/components/schemas/TriState'
            evidence_in_context:
              $ref: '#/components/schemas/TriState'
            evidence_used:
              $ref: '#/components/schemas/TriState'
            claims_grounded:
              $ref: '#/components/schemas/TriState'
            classification:
              $ref: '#/components/schemas/FailureClassification'
        explanation:
          type:
          - object
          - 'null'
          additionalProperties: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
    EvidenceNode:
      type: object
      required:
      - id
      - type
      - label
      properties:
        id:
