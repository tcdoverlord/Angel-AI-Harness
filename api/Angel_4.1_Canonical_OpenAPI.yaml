      operationId: archiveProject
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Project archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{project_id}/restore:
    post:
      tags:
      - Projects
      operationId: restoreProject
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Project restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{project_id}/conversations:
    get:
      tags:
      - Project Conversations
      operationId: listProjectConversations
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: pinned
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Conversations assigned to the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConversationPage'
    post:
      tags:
      - Project Conversations
      operationId: createProjectConversation
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectConversationCreateRequest'
      responses:
        '201':
          description: Project conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConversation'
  /projects/{project_id}/conversations/{conversation_id}:
    put:
      tags:
      - Project Conversations
      operationId: assignConversationToProject
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation assigned to the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConversation'
    delete:
      tags:
      - Project Conversations
      operationId: removeConversationFromProject
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ConversationId'
      responses:
        '204':
          description: Conversation removed from the project
  /projects/{project_id}/knowledge-packs:
    get:
      tags:
      - Project Knowledge
      operationId: listProjectKnowledgePacks
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Knowledge packs available to the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectKnowledgePackPage'
    post:
      tags:
      - Project Knowledge
      operationId: attachKnowledgePackToProject
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectKnowledgePackAttachRequest'
      responses:
        '201':
          description: Knowledge pack attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectKnowledgePack'
  /projects/{project_id}/knowledge-packs/{pack_id}:
    patch:
      tags:
      - Project Knowledge
      operationId: updateProjectKnowledgePack
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PackId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectKnowledgePackUpdateRequest'
      responses:
        '200':
          description: Project knowledge setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectKnowledgePack'
