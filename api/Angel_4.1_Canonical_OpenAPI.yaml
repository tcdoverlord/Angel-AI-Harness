            schema:
              $ref: '#/components/schemas/KnowledgeChangeItem'
      responses:
        '200':
          description: Updated knowledge change set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeChangeSet'
  /knowledge-change-sets/{change_set_id}/complete:
    post:
      tags:
      - Knowledge Changes
      operationId: completeKnowledgeChangeSet
      parameters:
      - $ref: '#/components/parameters/ChangeSetId'
      responses:
        '200':
          description: Completed change set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeChangeSet'
  /index-builds:
    post:
      tags:
      - Indexes
      operationId: createIndexBuild
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexBuildRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /operations/{operation_id}:
    get:
      tags:
      - Operations
      operationId: getOperation
      parameters:
      - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Asynchronous operation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
  /operations/{operation_id}/events:
    get:
      tags:
      - Operations
      operationId: streamOperationEvents
      parameters:
      - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Server-sent operation events
          content:
            text/event-stream:
              schema:
                type: string
  /projects:
    get:
      tags:
      - Projects
      operationId: listProjects
      parameters:
      - $ref: '#/components/parameters/ProjectStatusFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Projects accessible to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
    post:
      tags:
      - Projects
      operationId: createProject
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/invalid_request
                title: Bad Request
                status: 400
                code: INVALID_REQUEST
                detail: The request could not be processed.
                operation_id: createProject
                path: /projects
        '409':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/resource_conflict
                title: Conflict
                status: 409
                code: RESOURCE_CONFLICT
                detail: The resource changed or is otherwise incompatible with this operation.
                operation_id: createProject
                path: /projects
  /projects/{project_id}:
    get:
      tags:
      - Projects
      operationId: getProject
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project workspace
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/resource_not_found
                title: Not Found
                status: 404
                code: RESOURCE_NOT_FOUND
                detail: The requested resource does not exist or is not accessible.
                operation_id: getProject
                path: /projects/{project_id}
    patch:
      tags:
      - Projects
      operationId: updateProject
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Updated project
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/resource_not_found
                title: Not Found
                status: 404
                code: RESOURCE_NOT_FOUND
                detail: The requested resource does not exist or is not accessible.
                operation_id: updateProject
                path: /projects/{project_id}
        '412':
          description: Request could not be completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://angel.local/problems/precondition_failed
                title: Precondition Failed
                status: 412
                code: PRECONDITION_FAILED
                detail: The supplied resource version does not match the current version.
                operation_id: updateProject
                path: /projects/{project_id}
  /projects/{project_id}/workspace:
